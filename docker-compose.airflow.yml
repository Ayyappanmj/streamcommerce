# Airflow orchestration mode (resource intensive). Start with:
#   docker compose -f docker-compose.airflow.yml up -d --build
# UI: http://localhost:8080 (credentials are generated by `airflow standalone`; see container logs).
name: streamcommerce-airflow
services:
  airflow:
    build: { context: ., dockerfile: docker/Dockerfile.airflow }
    command: standalone
    env_file: [.env]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/streamcommerce/dags
      STREAMCOMMERCE_DATA_DIR: /opt/streamcommerce/data
      METADATA_BACKEND: sqlite
    volumes:
      - ./dags:/opt/streamcommerce/dags
      - ./src:/opt/streamcommerce/src
      - ./dbt_project:/opt/streamcommerce/dbt_project
      - ./sql:/opt/streamcommerce/sql
      - ./data:/opt/streamcommerce/data
      - airflow-home:/opt/airflow
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
volumes:
  airflow-home:
