# Lightweight by default: only PostgreSQL starts. Other services are opt-in via profiles:
#   docker compose up -d postgres
#   docker compose --profile streaming up -d      # + Redpanda (Kafka API)
#   docker compose --profile dashboard up -d      # + Streamlit dashboard on http://localhost:8501
#   docker compose --profile app run --rm app     # run the batch pipeline in a container (PySpark engine)
name: streamcommerce
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamcommerce}
      POSTGRES_USER: ${POSTGRES_USER:-streamcommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    profiles: ["streaming"]
    image: redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    profiles: ["app"]
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [.env]
    environment:
      METADATA_BACKEND: postgres
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    volumes: ["./data:/app/data"]
    depends_on:
      postgres: { condition: service_healthy }

  dashboard:
    profiles: ["dashboard"]
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: [.env]
    environment:
      METADATA_BACKEND: postgres
      POSTGRES_HOST: postgres
    command: ["streamlit", "run", "app/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    volumes: ["./data:/app/data"]
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redpanda-data:
