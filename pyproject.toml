[project]
name = "streamcommerce"
version = "1.0.0"
description = "Real-time e-commerce data engineering platform (batch + streaming, local-first)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "external: needs an external service (Kafka, PostgreSQL, dbt+DuckDB); skipped when unavailable",
    "snowflake: needs real Snowflake credentials; never run in CI",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/**/*.py" = ["E402"]
"dags/*.py" = ["E402"]
