version: 2
models:
  - name: daily_sales
    columns:
      - name: order_date
        tests: [unique, not_null]
  - name: product_performance
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: customer_lifetime_value
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: refund_rate
    columns:
      - name: order_month
        tests: [unique, not_null]
